<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="theme-color" content="#0B1026"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-512.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Gramo"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><script src="demo.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gramo</title>
<style>
/* Filamento 3G · estilo de la marca Estudio 3G: Outfit pesado, bordes gruesos, sombra dura, colores pop, doble raya del logo. */
@font-face{font-family:'Outfit';src:url(fonts/outfit.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'Press Start 2P';src:url(fonts/pressstart.woff2) format('woff2');font-weight:400;font-display:swap}
:root{
  --paper:#F6F6F4; --card:#FFFFFF; --ink:#161616; --edge:#161616; --muted:#575757; --soft:#ECEBE6;
  --g:#2BD96B; --b:#2F6BFF; --o:#FF7A1A; --y:#FFC21A; --p:#FF4F9A;
  --ok:#17B351; --warn:#FF7A1A; --bad:#E5322D;
  --font:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif; --px:'Press Start 2P',monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111114; --card:#1C1C21; --ink:#F1EFEA; --edge:#3A3A44; --muted:#A3A2AB; --soft:#26262D;
    --ok:#2BD96B; --bad:#FF5A52; color-scheme:dark;
  }
}
:root[data-theme="dark"]{--paper:#111114; --card:#1C1C21; --ink:#F1EFEA; --edge:#3A3A44; --muted:#A3A2AB; --soft:#26262D; --ok:#2BD96B; --bad:#FF5A52; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-weight:600;font-size:16px;line-height:1.35;
  padding-block:calc(18px + env(safe-area-inset-top,0px)) 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* semitono de la esquina, como en los Reels */
body::before{content:"";position:fixed;top:0;right:0;width:230px;height:230px;pointer-events:none;z-index:0;opacity:.5;
  background:radial-gradient(circle,var(--y) 28%,transparent 31%) 0 0/16px 16px;
  -webkit-mask-image:radial-gradient(circle at 100% 0,#000 0,transparent 68%);mask-image:radial-gradient(circle at 100% 0,#000 0,transparent 68%)}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;font-family:var(--font)}
h1{font-weight:800;font-size:33px;line-height:.98;letter-spacing:-1.4px;text-transform:uppercase}
h1 mark{background:var(--y);color:#161616;padding:0 7px 2px;border-radius:7px;display:inline-block;transform:rotate(-2.5deg)}
h2{font-weight:800;font-size:19px;letter-spacing:-.3px;text-transform:uppercase;display:flex;align-items:center;gap:20px}
h2::before{content:"";flex:none;width:6px;height:17px;background:var(--o);box-shadow:11px 0 0 var(--o);transform:skewX(-20deg);margin-left:2px}
h3{font-weight:800;font-size:19px;letter-spacing:-.4px;line-height:1.1;overflow-wrap:anywhere}
.hello{display:flex;align-items:center;gap:14px}
.geo{position:relative;width:80px;height:80px;flex:none;background:var(--y);border:3px solid var(--edge);border-radius:20px;box-shadow:5px 5px 0 var(--edge);display:grid;place-items:end center;overflow:hidden;padding:0;cursor:pointer;font:inherit;color:inherit}
.geo:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--edge)}
#geoSv{display:block;line-height:0}
.pen{position:absolute;right:3px;top:3px;width:21px;height:21px;border-radius:7px;background:#161616;color:#F1EFEA;display:grid;place-items:center;border:2px solid #F1EFEA}
.geo svg{display:block;image-rendering:pixelated;shape-rendering:crispEdges}
.sub{color:var(--muted);font-size:14px;font-weight:600;margin-top:6px}
.tag{display:inline-block;font-family:var(--px);font-size:8px;line-height:1;letter-spacing:0;text-transform:uppercase;padding:5px 7px 4px;background:var(--y);color:#161616;
  border:2px solid #161616;box-shadow:2px 2px 0 #161616;transform:rotate(-4deg);vertical-align:middle;margin-left:6px;white-space:nowrap}
.tag.pink{background:var(--p)} .tag.green{background:var(--g)} .tag.blue{background:var(--b);color:#fff}
.hello>div:last-child{flex:1;min-width:0}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.toprow .tag{margin:0}
.themebtn{width:38px;height:38px;flex:none;border:3px solid var(--edge);background:var(--card);color:var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--edge);display:grid;place-items:center;cursor:pointer;padding:0}
.themebtn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--edge)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--card);border:3px solid var(--edge);border-radius:16px;padding:10px 10px 9px;min-width:0;box-shadow:4px 4px 0 var(--c,var(--edge))}
.stat b{display:block;font-weight:800;font-size:25px;letter-spacing:-.8px;font-variant-numeric:tabular-nums;line-height:1.05}
.stat span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-top:3px;line-height:1.15}
.card{background:var(--card);border:3px solid var(--edge);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:6px 6px 0 var(--c,var(--edge))}
.spool{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center}
.spool svg{display:block}
.meta{font-size:13.5px;color:var(--muted);font-weight:600}
.grams{font-weight:800;font-size:30px;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.05;margin-top:4px}
.grams small{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:0}
/* barra de vida, como en los videos */
.life{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:7px}
.life i{height:13px;background:var(--soft);border:2px solid var(--edge);border-radius:3px}
.life i.on{background:var(--lc,var(--ok))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:800 13px var(--font);text-transform:uppercase;letter-spacing:.3px;border:3px solid var(--edge);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:13px;box-shadow:3px 3px 0 var(--edge);cursor:pointer}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--edge)}
.btn.primary{background:var(--o);color:#161616;border-color:#161616;box-shadow:3px 3px 0 #161616}
.btn.big{width:100%;padding:14px;font-size:15px}
.btn.ghost{background:none;border-color:transparent;box-shadow:none;color:var(--muted);padding-inline:8px}
.btn.ghost:active{transform:none}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.55}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--b);outline-offset:2px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);min-width:0}
input,select{font:700 16px var(--font);text-transform:none;letter-spacing:0;background:var(--paper);color:var(--ink);border:3px solid var(--edge);border-radius:13px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus{box-shadow:3px 3px 0 var(--b);outline:none}
input[type=color]{padding:3px;height:48px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.line{display:grid;grid-template-columns:1fr 96px 42px;gap:8px;align-items:end}
.empty{display:flex;align-items:flex-end;gap:12px;border:3px dashed var(--edge);border-radius:20px;padding:14px 14px 0;color:var(--ink)}
.empty svg{flex:none;display:block}
.bubble{position:relative;background:var(--card);border:3px solid var(--edge);border-radius:16px;padding:10px 12px;margin-bottom:14px;font-weight:700;font-size:15px;line-height:1.3}
.bubble::before{content:"";position:absolute;left:-10px;bottom:14px;width:14px;height:14px;background:var(--card);border-left:3px solid var(--edge);border-bottom:3px solid var(--edge);transform:rotate(45deg)}
.hist{display:flex;flex-direction:column;gap:8px}
.hist .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.3px}
.hist .head span:first-child{overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;background:var(--soft);border:2px solid var(--edge);border-radius:99px;padding:3px 11px 3px 4px}
.chip i{width:16px;height:16px;border-radius:50%;border:2px solid var(--edge)}
.note{font-size:14px;font-weight:700;color:var(--warn)}
.sec{display:flex;justify-content:space-between;align-items:center;gap:8px}
/* impresoras */
.printer{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center}
.pill{display:inline-block;font-family:var(--px);font-size:8px;line-height:1;text-transform:uppercase;padding:6px 8px 5px;background:var(--soft);color:var(--ink);border:2px solid var(--edge);border-radius:4px}
.pill i{display:none}
.pill.on{background:var(--g);color:#161616;border-color:#161616} .pill.busy{background:var(--o);color:#161616;border-color:#161616} .pill.bad{background:var(--p);color:#161616;border-color:#161616}
.bigpct{font-weight:800;font-size:38px;letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums}
.prog{display:grid;grid-template-columns:repeat(20,1fr);gap:2px}
.prog i{height:16px;background:var(--soft);border:2px solid var(--edge);border-radius:2px}
.prog i.on{background:var(--o)}
.codein{font-weight:800;font-size:28px;letter-spacing:8px;text-align:center}
/* menú de abajo */
.nav{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;gap:5px;background:#161616;border:3px solid #161616;padding:5px;border-radius:20px;width:min(440px,calc(100vw - 24px));box-shadow:0 0 0 3px var(--paper),5px 5px 0 3px var(--edge)}
.nav button{position:relative;flex:1;border:0;background:none;color:#F1EFEA;font:800 11px var(--font);text-transform:uppercase;letter-spacing:.4px;padding:7px 2px 6px;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.nav button svg{width:22px;height:22px}
.nav button[aria-selected="true"]{color:#161616}
.nav [data-v=bobinas][aria-selected="true"]{background:var(--g)} .nav [data-v=imprimir][aria-selected="true"]{background:var(--o)}
.nav [data-v=impresoras][aria-selected="true"]{background:var(--b);color:#fff} .nav [data-v=numeros][aria-selected="true"]{background:var(--o)} .nav [data-v=gastos][aria-selected="true"]{background:var(--y)} .nav [data-v=historial][aria-selected="true"]{background:var(--p)}
.nav .dot{position:absolute;top:2px;right:calc(50% - 20px);width:12px;height:12px;border-radius:50%;background:var(--y);border:2px solid #161616}
.toast{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 84px);background:var(--y);color:#161616;border:3px solid #161616;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:800;max-width:90vw;box-shadow:4px 4px 0 #161616;text-align:center}
@media (prefers-reduced-motion:no-preference){.life i,.prog i{transition:background .3s} .anim .card{animation:up .3s both} @keyframes up{from{opacity:0;transform:translateY(8px)}}}
@media (max-width:380px){.stats{gap:8px}.stat b{font-size:21px}h1{font-size:29px}}

/* mi pixel */
.prevcard{position:sticky;top:8px;z-index:4;flex-direction:row;align-items:center;gap:14px}
.pv{flex:none;border:3px solid var(--edge);border-radius:18px;box-shadow:4px 4px 0 var(--edge);display:grid;place-items:end center;overflow:hidden;line-height:0;padding-top:6px}
.prevtxt{display:flex;flex-direction:column;gap:8px;min-width:0}
.prevtxt h3{font-size:24px}
.opt .lab{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-top:2px}
.chipsel,.swatches{display:flex;flex-wrap:wrap;gap:8px}
.opt-chip{font:800 13px var(--font);border:3px solid var(--edge);border-radius:99px;padding:6px 13px;background:var(--card);color:var(--ink);cursor:pointer}
.opt-chip.on{background:var(--y);color:#161616;border-color:#161616;box-shadow:2px 2px 0 #161616}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--edge);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--ink)}
.prevcard .btn{padding:7px 11px;font-size:12px}
.prevcard .row{gap:8px}

/* bobinas de cada impresora */
.slots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:26px 8px 10px;min-width:0;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;
  border:3px solid var(--edge);border-radius:18px;box-shadow:4px 4px 0 var(--sc,var(--edge))}
.slot:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--edge)}
.slot.vacio{background:transparent;border-style:dashed;box-shadow:none}
.slot-no{position:absolute;top:-3px;left:-3px;font-family:var(--px);font-size:8px;line-height:1;padding:6px 7px 5px;background:var(--y);color:#161616;border:3px solid #161616;border-radius:10px 4px 8px 4px}
.slot-txt{display:flex;flex-direction:column;gap:3px;align-items:center;min-width:0;width:100%}
.slot-name{font-weight:800;font-size:15px;line-height:1.1;letter-spacing:-.2px;overflow-wrap:anywhere}
.slot-sub{font-size:12px;font-weight:700;color:var(--muted);line-height:1.2}
.slot .tag{margin:4px 0 0;font-size:7px}
.slot.ext{grid-column:1/-1;flex-direction:row;text-align:left;padding:16px 12px 12px 54px;gap:14px}
.slot.ext .slot-no{top:-3px;left:-3px}
.slot.ext .slot-txt{align-items:flex-start;width:auto}
/* hoja para elegir */
.sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.sheet[hidden]{display:none}
.sheet-back{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet-card{position:relative;max-height:82vh;overflow:auto;background:var(--paper);border:3px solid var(--edge);border-bottom:0;border-radius:24px 24px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-width:560px;width:100%;margin:0 auto}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sheet-head h3{font-size:19px}
.plist{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:8px 10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;border:3px solid var(--edge);border-radius:16px;box-shadow:3px 3px 0 var(--edge)}
.prow:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--edge)}
.prow.on{border-color:#161616;background:color-mix(in srgb,var(--g) 22%,var(--card))}
.prow .ptxt{flex:1;min-width:0}.prow .ptxt b{display:block;font-weight:800;font-size:16px;line-height:1.1;overflow-wrap:anywhere}
.prow svg{flex:none}.prow .tag{margin:0;flex:none}
/* colores de Bambu */
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-height:300px;overflow:auto;padding:4px}
.cs{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;border:3px solid var(--edge);border-radius:14px;min-width:0}
.cs .dot{width:38px;height:38px;border-radius:50%;border:3px solid #161616;display:block}
.cs .cn{font-size:11.5px;font-weight:700;line-height:1.1;text-align:center;overflow-wrap:anywhere}
.cs.on{background:var(--y);color:#161616;border-color:#161616;box-shadow:3px 3px 0 #161616}
.cinfo{display:flex;align-items:center;gap:12px;min-height:40px}
.prevspool{flex:none;border-radius:50%;border:3px solid #161616}

/* números */
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chart{display:flex;align-items:flex-end;gap:3px;height:140px;padding:10px 8px 0;border:3px solid var(--edge);border-radius:16px;background:var(--paper)}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.chart .col i{display:block;width:100%;background:var(--o);border:2px solid var(--edge);border-bottom:0;border-radius:4px 4px 0 0;min-height:3px}
.chart .col.zero i{background:var(--soft);border-color:transparent;min-height:3px}
.chartlab{display:flex;gap:3px;font-size:10px;font-weight:800;color:var(--muted)}
.chartlab span{flex:1;text-align:center;min-width:0;overflow:visible;white-space:nowrap}
.brow{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:baseline}
.brow b{font-weight:800;font-size:15px;overflow-wrap:anywhere}
.btrack{grid-column:1/-1;height:15px;background:var(--soft);border:2px solid var(--edge);border-radius:5px;overflow:hidden}
.btrack i{display:block;height:100%;border-right:2px solid var(--edge)}

/* historial */
.bigtot{font-weight:800;font-size:22px;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.dayh{font-family:var(--px);font-size:9px;text-transform:uppercase;color:var(--muted);margin:6px 2px -6px}
.hlist{display:flex;flex-direction:column;gap:10px}
.hrow{background:var(--card);border:3px solid var(--edge);border-radius:16px;box-shadow:4px 4px 0 var(--hc,var(--edge));overflow:hidden}
.hrow.imp{--hc:var(--o)} .hrow.gas{--hc:var(--p)} .hrow.ven{--hc:var(--g)}
.hhead{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;background:none;border:0;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.hic{flex:none;width:40px;height:40px;border-radius:12px;border:3px solid #161616;display:grid;place-items:center;color:#161616;background:var(--hc,var(--o))}
.htx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.htx b{font-weight:800;font-size:16px;line-height:1.1;overflow-wrap:anywhere}
.htx small{font-size:12.5px;font-weight:700;color:var(--muted)}
.hamt{flex:none;font-weight:800;font-size:17px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.hrow.gas .hamt{color:var(--bad)} .hrow.ven .hamt{color:var(--ok)}
.hdet{display:flex;flex-direction:column;gap:10px;padding:2px 14px 14px;border-top:3px dashed var(--soft);margin:0 0 0;padding-top:12px}
.card>.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

/* 5 pestañas abajo */
.nav{gap:2px}
.nav button{font-size:9.5px;letter-spacing:0;padding:7px 0 6px}
.nav button svg{width:21px;height:21px}
/* gráficas con valor */
.chart .col{cursor:pointer;border-radius:6px}
.chart .grp{display:flex;align-items:flex-end;gap:1px;height:100%;width:100%}
.chart .grp i{flex:1;width:auto;min-height:3px}
.chart .grp i.z{background:var(--soft)!important;border-color:transparent}
.chart .col.sel{background:color-mix(in srgb,var(--y) 40%,transparent)}
.readout{min-height:40px;font-size:13px;font-weight:700;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.readout b{color:var(--ink);text-transform:capitalize;font-weight:800;font-size:14px;flex-basis:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;font-weight:800}
.rv{display:inline-flex;align-items:center;gap:6px}
.rv i{width:12px;height:12px;border-radius:4px;border:2px solid var(--edge);display:inline-block}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.totals .stat b{font-size:21px}
.totals .stat span{font-family:var(--px);font-size:8px;letter-spacing:0;margin-top:6px}
/* gastos con foto */
textarea{font:700 16px var(--font);background:var(--paper);color:var(--ink);border:3px solid var(--edge);border-radius:13px;padding:10px 12px;width:100%;resize:vertical}
textarea:focus{box-shadow:3px 3px 0 var(--b);outline:none}
.fprev{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.fprev img{max-width:100%;max-height:220px;border:3px solid var(--edge);border-radius:14px}
.hic.th{padding:0;overflow:hidden;background:var(--soft)}
.hth{width:100%;height:100%;object-fit:cover;display:block}
.fdesc{font-weight:600;font-size:15px;line-height:1.35;white-space:pre-wrap}

<script>
(function(){
  // ---------- Base de datos local (en el celular) con la misma forma que usaba la versión web ----------
  var LDB=(function(){
    var KEY='f3g-db', data;
    try{data=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){data={}}
    var subs={}, pend={};
    function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
    function clone(v){return JSON.parse(JSON.stringify(v))}
    function snapOf(c){var o=data[c]||{};return {docs:Object.keys(o).map(function(id){return {id:id,data:function(){return clone(o[id])}}})}}
    function later(c){if(pend[c])return;pend[c]=1;setTimeout(function(){pend[c]=0;(subs[c]||[]).forEach(function(f){f(snapOf(c))})},0)}
    function nid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
    function ref(c,id){return {id:id,
      set:function(v){(data[c]=data[c]||{})[id]=clone(v);save();later(c);return Promise.resolve()},
      update:function(v){var cur=(data[c]||{})[id];if(!cur)return Promise.reject(new Error('no existe'));Object.assign(cur,clone(v));save();later(c);return Promise.resolve()},
      delete:function(){if(data[c])delete data[c][id];save();later(c);return Promise.resolve()}}}
    return {
      collection:function(c){return {doc:function(id){return ref(c,id||nid())},
        add:function(v){var r=ref(c,nid());return r.set(v).then(function(){return r})},
        onSnapshot:function(f){(subs[c]=subs[c]||[]).push(f);setTimeout(function(){f(snapOf(c))},0)}}},
      doc:function(p){var s=p.split('/');return ref(s[0],s[1])}
    };
  })();

  var db=LDB, spools=[], prints=[], printers=[], jobs=[], loaded=false, view='bobinas', adjusting=null, showAdd=false;
  var lines=[{spoolId:'',g:''}];
  var VIEWS=['bobinas','impresoras','pedidos','numeros','gastos','historial','imprimir','yo'];
  var NATIVE=!!(window.Bambu&&window.Bambu.ok);
  var live={}, conn={};           // estado en vivo por número de serie (no se guarda)
  var adding=null;                 // flujo de "Agregar impresora"

  // ---------- Cuenta de Bambu (nube): lee el historial de impresiones, sin tocar el modo solo LAN ----------
  var CK='f3g-cloud', cloud=null, cloudUI=null, cloudSyncing=false, httpCb={}, httpN=0;
  try{cloud=JSON.parse(localStorage.getItem(CK))||null}catch(e){cloud=null}
  function saveCloud(){try{if(cloud)localStorage.setItem(CK,JSON.stringify(cloud));else localStorage.removeItem(CK)}catch(e){}}
  function api(method,path,body,token){
    return new Promise(function(res,rej){
      if(!NATIVE)return rej(new Error('Esto funciona en la app instalada en el celular'));
      var id='h'+(++httpN);
      var t=setTimeout(function(){delete httpCb[id];rej(new Error('Bambu no respondió'))},30000);
      httpCb[id]=function(e){clearTimeout(t);
        if(e.status===0)return rej(new Error('No hay conexión a internet ('+(e.error||'')+')'));
        var j=null;try{j=JSON.parse(e.body)}catch(x){}
        res({status:e.status,json:j,text:e.body||''})};
      window.Bambu.http(id,method,'https://api.bambulab.com'+path,body?JSON.stringify(body):'',token||'');
    });
  }
  function errTxt(r){
    var j=r.json||{};
    if(j.message&&typeof j.message==='string'&&j.message!=='success')return j.message;
    if(j.error)return String(j.error);
    if(r.status===401)return 'Bambu no aceptó los datos. Revisa tu correo y contraseña.';
    if(r.status===403||(r.text&&r.text.indexOf('<html')>-1))return 'Bambu bloqueó este intento (error '+r.status+'). Prueba más tarde.';
    if(r.status===429)return 'Demasiados intentos. Espera unos minutos.';
    return 'Bambu respondió con un error ('+r.status+').';
  }
  function cloudLogin(email,password){
    return api('POST','/v1/user-service/user/login',{account:email,password:password,apiError:''}).then(function(r){
      var j=r.json||{};
      if(j.accessToken){finishLogin(email,j.accessToken);return 'ok'}
      if(j.loginType==='verifyCode')return api('POST','/v1/user-service/user/sendemail/code',{email:email,type:'codeLogin'}).then(function(r2){if(r2.status>=400)throw new Error(errTxt(r2));return 'code'});
      if(j.loginType==='tfa')throw new Error('Tu cuenta usa verificación en dos pasos con una app autenticadora. Todavía no la soporto.');
      throw new Error(errTxt(r));
    });
  }
  function cloudVerify(email,code){
    return api('POST','/v1/user-service/user/login',{account:email,code:code}).then(function(r){
      var j=r.json||{};if(j.accessToken){finishLogin(email,j.accessToken);return}throw new Error(errTxt(r));
    });
  }
  function finishLogin(email,token){
    cloud={email:email,token:token,since:new Date().toISOString(),last:null,err:''};saveCloud();cloudUI=null;startLive.key='';
    toast('¡Cuenta de Bambu conectada!');cloudSync();
  }
  function cloudOut(){cloud=null;saveCloud();cloudUI=null;if(NATIVE)window.Bambu.disconnectCloud();live={};render()}
  function normHex(c){if(!c)return null;c=String(c).replace('#','');return c.length>=6?'#'+c.slice(0,6).toLowerCase():null}
  function colorDist(a,b){var x=[1,3,5].map(function(i){return parseInt(a.substr(i,2),16)-parseInt(b.substr(i,2),16)});return x[0]*x[0]+x[1]*x[1]+x[2]*x[2]}
  function startLive(){}
  function cloudSync(){
    if(!cloud||!cloud.token||cloudSyncing||!loaded)return;
    cloudSyncing=true;var tok=cloud.token;
    api('GET','/v1/iot-service/api/user/bind',null,tok).then(function(r){
      if(r.status===401||(r.json&&r.json.code===1)){throw {expired:true}}
      if(r.status>=400)throw new Error(errTxt(r));
      var devs=(r.json&&r.json.devices)||[];
      devs.forEach(function(d,i){
        var id=d.dev_id;if(!id)return;
        var ex=printers.find(function(p){return p.id===id});
        var live2={cloud:true,cloudOnline:d.online!==false,cloudStatus:d.print_status||'',cloudAt:Date.now()};
        if(ex)db.doc('printers/'+id).update(live2);
        else db.doc('printers/'+id).set(Object.assign({name:d.name||'Impresora',model:d.dev_product_name||'Bambu Lab',serial:id,order:printers.length+i+1,
          slots:[{key:'ext',label:'Bobina',spoolId:''}],pairedAt:new Date().toISOString()},live2));
      });
      var serials=devs.map(function(d){return d.dev_id}).filter(Boolean);
      var needUid=cloud.uid?Promise.resolve():api('GET','/v1/design-user-service/my/preference',null,tok).then(function(p){var u=p.json&&(p.json.uid||p.json.uidStr);if(u&&cloud){cloud.uid=String(u);saveCloud()}}).catch(function(){});
      return needUid.then(function(){
        // avance en vivo (porcentaje, tiempo, bobinas del AMS) por la nube de Bambu
        if(cloud&&cloud.uid&&serials.length){var key=cloud.uid+'|'+serials.join(',');if(startLive.key!==key){startLive.key=key;window.Bambu.connectCloud(cloud.uid,tok,serials.join(','))}}
        return api('GET','/v1/user-service/my/tasks?limit=20',null,tok);
      });
    }).then(function(r){
      if(!r||!cloud)return;
      if(r.status===401)throw {expired:true};
      if(r.status>=400)throw new Error(errTxt(r));

  function spoolSvg(color,p,size){
    var s=sv('svg',{viewBox:'0 0 80 80',width:size||76,height:size||76,'aria-hidden':'true'});
    s.appendChild(sv('circle',{cx:40,cy:40,r:37,fill:'#26262d',stroke:'var(--edge)','stroke-width':3}));
    var rf=14+21*(p/100);
    s.appendChild(sv('circle',{cx:40,cy:40,r:rf,fill:color||'#999',stroke:'#161616','stroke-width':2.5}));
    for(var r=rf-4;r>16;r-=4)s.appendChild(sv('circle',{cx:40,cy:40,r:r,fill:'none',stroke:'rgba(0,0,0,.18)','stroke-width':1}));
    s.appendChild(sv('path',{d:'M'+(40-rf*0.7)+' '+(40-rf*0.5)+' A'+rf*0.85+' '+rf*0.85+' 0 0 1 '+(40+rf*0.2)+' '+(40-rf*0.82),fill:'none',stroke:'rgba(255,255,255,.45)','stroke-width':2.4,'stroke-linecap':'round'}));
    s.appendChild(sv('circle',{cx:40,cy:40,r:13,fill:'#F6F6F4',stroke:'#161616','stroke-width':2.5}));

  function stats(){
    var low=spools.filter(function(s){return pct(s)<15}).length;

    var ps=periodOf(periodEndFor(new Date())), st=dateOf(ps.start);st.setHours(0,0,0,0);
    var used=prints.filter(function(p){return new Date(p.createdAt).getTime()>=st.getTime()}).reduce(function(a,p){return a+(p.totalG||0)},0);
    var saldo=incomes.reduce(function(a,x){return a+(x.amountQ||0)},0)-expenses.reduce(function(a,x){return a+(x.amountQ||0)},0);
    var box=$('stats');box.textContent='';
    [[g(used),'gastados desde el '+st.toLocaleDateString('es-GT',{day:'numeric',month:'short'}),'var(--b)',0],
     [String(low),low===1?'bobina por acabarse':'bobinas por acabarse',low?'var(--p)':'var(--o)',0],

  function spoolCard(s){

    if(p<15)title.appendChild(el('span',{class:'tag pink',text:'Se acaba'}));
    var where=printers.map(function(pr){var sl=(pr.slots||[]).find(function(x){return x.spoolId===s.id});return sl?pr.name+' · '+sl.label:null}).filter(Boolean)[0];
    var info=el('div',{},[title,el('div',{class:'meta',text:[s.material,s.brand,where?'en '+where:''].filter(Boolean).join(' · ')}),
      el('div',{class:'grams'},[document.createTextNode(gr(s.remainingG)+' '),el('small',{text:'g de '+gr(s.initialG)})]),
      lifeBar(p)]);
    var card=el('div',{class:'card'},[el('div',{class:'spool'},[spoolSvg(s.colorHex,p),info])]);
    card.style.setProperty('--c',shadowFor(s.colorHex));
    if(adjusting===s.id){
      var inp=el('input',{type:'number',inputmode:'decimal',min:'0',step:'any',value:String(Math.round(s.remainingG*10)/10),'aria-label':'Gramos que quedan'});
      card.appendChild(el('label',{},['Pesé la bobina (sin el carrete) y quedan, en gramos',inp]));
      card.appendChild(el('div',{class:'row'},[
        el('button',{class:'btn primary',text:'Guardar',onclick:function(){var v=parseFloat(inp.value);if(isNaN(v)||v<0)return toast('Escribe un peso válido');
          db.doc('spools/'+s.id).update({remainingG:v}).then(function(){adjusting=null;toast('Peso actualizado')}).catch(fail)}}),
        el('button',{class:'btn',text:'Cancelar',onclick:function(){adjusting=null;render()}})]));
    }else{
      card.appendChild(el('div',{class:'row'},[
        el('button',{class:'btn',text:'Ajustar peso',onclick:function(){adjusting=s.id;render()}}),
        el('button',{class:'btn ghost danger',text:'Quitar',onclick:function(){
          if(this.dataset.sure!=='1'){this.dataset.sure='1';this.textContent='¿Seguro? Toca otra vez';return}
          db.doc('spools/'+s.id).delete().then(function(){toast('Bobina quitada')}).catch(fail)}})]));
    }
    return card;
  }

  // Anota el cobro (venta suelta o del pedido) y devuelve los campos para la impresión
  function saleCommit(r,name,date,pid){
    var now=new Date().toISOString();

      var o=orders.find(function(x){return x.id===r.orderId});if(!o)return Promise.resolve({});
      if(ost(o)==='pend')return db.doc('orders/'+o.id).update({status:'imprimiendo'}).then(function(){return {orderId:o.id}});
      return Promise.resolve({orderId:o.id});
    }
    if(r.sale>0){var iref=db.collection('incomes').doc();
      return iref.set({concept:name,amountQ:r.sale,date:date,createdAt:now,printId:pid}).then(function(){return {saleQ:r.sale,incomeId:iref.id}})}
    return Promise.resolve({});

  function submitPrint(name,raw,extra,saleKey){

    if(!items.length){toast('Elige una bobina y los gramos');return Promise.resolve(false)}
    var r=saleKey?saleOf(saleKey):{sale:0,orderId:''};
    if(r===null)return Promise.resolve(false);
    var sale=r.sale;
    var rec={name:name||'Impresión',createdAt:new Date().toISOString(),totalG:0,costQ:0,lines:[]};
    if(extra)for(var k in extra)rec[k]=extra[k];
    items.forEach(function(it){var s=byId(it.spoolId);rec.totalG=Math.round((rec.totalG+it.g)*100)/100;rec.costQ=Math.round((rec.costQ+costG(s)*it.g)*100)/100;rec.lines.push({spoolId:s.id,label:s.name,colorHex:s.colorHex,g:it.g})});
    var pref=db.collection('prints').doc();
    var chain=saleCommit(r,rec.name,todayStr(),pref.id).then(function(f){for(var k in f)rec[k]=f[k];return pref.set(rec)});
    items.forEach(function(it){chain=chain.then(function(){var s=byId(it.spoolId);s.remainingG=Math.max(0,Math.round((s.remainingG-it.g)*100)/100);return db.doc('spools/'+s.id).update({remainingG:s.remainingG})})});
    return chain.then(function(){if(saleKey)delete saleSt[saleKey];if(!extra){lines=[{spoolId:'',g:''}];go('historial')}var lo=r.orderId&&orders.find(function(o){return o.id===r.orderId});toast(lo?'¡Listo! Enlazada a '+lo.name:sale>0?'¡Listo! Descontado y venta de '+q(sale)+' anotada':'¡Listo! Ya lo descontamos');render();return true}).catch(function(e){fail(e);return false});

  function traysOf(L){

    var v=L.vt_tray;if(v&&v.tray_type)out.ext={type:v.tray_type,sub:v.tray_sub_brands||'',uuid:v.tray_uuid||'',color:v.tray_color?'#'+String(v.tray_color).slice(0,6):null,remain:(v.remain!=null&&v.remain>=0)?v.remain:null,weight:parseFloat(v.tray_weight)||1000};

  function slotsFromLive(L){
    var s=[];
    ((L.ams&&L.ams.ams)||[]).forEach(function(u){[0,1,2,3].forEach(function(i){s.push({key:trayKey(u.id,i),label:(L.ams.ams.length>1?'AMS '+(+u.id+1)+' · ':'AMS ')+(i+1),spoolId:''})})});

  function currentTrayKey(L){

  function merge(a,b){for(var k in b){var v=b[k];if(v&&typeof v==='object'&&!Array.isArray(v)&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))merge(a[k],v);else a[k]=v}return a}

  window.bambuEvent=function(json){
    var e;try{e=JSON.parse(json)}catch(x){return}
    if(e.type==='http'){var cb=httpCb[e.id];if(cb){delete httpCb[e.id];cb(e)}return}
    if(e.type==='conn'){conn[e.serial]={state:e.state,msg:e.msg,at:Date.now()};soon();return}
    if(e.type==='msg'){
      var m;try{m=JSON.parse(e.payload)}catch(x){return}
      if(!m.print)return;
      var L=live[e.serial]=merge(live[e.serial]||{},m.print);L._at=Date.now();
      ensureSlots(e.serial,L);autoSpools(e.serial,L);soon();
    }
  };

  // La impresora dice si tiene AMS o no: ajusto las ranuras para que coincidan (con AMS: 4 por unidad; sin AMS: solo la bobina externa)
  function ensureSlots(sn,L){
    var pr=printers.find(function(p){return p.id===sn});if(!pr||!L.ams||!Array.isArray(L.ams.ams)||ensureSlots.busy)return;

  // ---------- Corte financiero de cada día 15 ----------
  function periodEndFor(d){return d.getDate()<=15?new Date(d.getFullYear(),d.getMonth(),15):new Date(d.getFullYear(),d.getMonth()+1,15)}
  function periodOf(end){return {start:ymd(new Date(end.getFullYear(),end.getMonth()-1,16)),end:ymd(end)}}
  function allPeriods(){
    var ts=[];incomes.forEach(function(x){ts.push(tOf(x.date))});expenses.forEach(function(x){ts.push(tOf(x.date))});prints.forEach(function(p){ts.push(new Date(p.createdAt).getTime())});
    cortes.forEach(function(c){ts.push(tOf(c.start))});
    if(!ts.length)return [];
    var out=[],end=periodEndFor(new Date(Math.min.apply(null,ts))),last=periodEndFor(new Date());
    while(end<=last){out.push(periodOf(end));end=new Date(end.getFullYear(),end.getMonth()+1,15)}
    return out.reverse();
  }
  function buildCut(p){

    var g=expenses.filter(function(x){return inP(x.date)}).sort(function(a,b){return a.date<b.date?-1:1}).map(function(x){return {id:x.id,d:x.date,n:x.concept||'Gasto',k:x.kind||'',ds:x.desc||'',a:x.amountQ||0,ph:x.photoId||''}});
    var ps=prints.filter(function(x){return inP(ymd(new Date(x.createdAt)))});
    var tv=v.reduce(function(a,x){return a+x.a},0),tg=g.reduce(function(a,x){return a+x.a},0);
    return {start:p.start,end:p.end,ventas:tv,gastos:tg,ganancia:tv-tg,vItems:v,gItems:g,gramos:Math.round(ps.reduce(function(a,x){return a+(x.totalG||0)},0)*10)/10,nImp:ps.length};
  }
  function digestCut(c){return [c.ventas,c.gastos,c.gramos,c.nImp,c.vItems.map(function(x){return x.id+':'+x.a}).join(','),c.gItems.map(function(x){return x.id+':'+x.a}).join(',')].join('|')}
  var cutBusy=false;
  function runCortes(){
    if(!loaded||cutBusy)return;
    var tdy=todayStr(),ops=[];
    allPeriods().filter(function(p){return p.end<=tdy}).forEach(function(p){
      var id='c'+p.end,ex=cortes.find(function(c){return c.id===id});if(ex&&ex.frozen)return;
      var cut=buildCut(p);cut.frozen=tdy>p.end;cut.dig=digestCut(cut);
      if(ex&&ex.dig===cut.dig&&!!ex.frozen===cut.frozen)return;
      if(!cut.vItems.length&&!cut.gItems.length&&!cut.nImp&&!ex)return;   // periodo vacío: no guardo nada

    });

    var card=el('div',{class:'hrow cut'+(open?' open':'')},[el('button',{type:'button',class:'hhead','aria-expanded':open?'true':'false',onclick:function(){cutOpen[c.end]=!cutOpen[c.end];render()}},[
      el('span',{class:'htx'},[el('b',{text:title}),el('small',{},[el('span',{class:'tag '+(c.frozen?'green':'pink'),text:st}),document.createTextNode(' '+(c.vItems.length+c.gItems.length)+' movimientos')])]),
      el('span',{class:'cutnums'},[el('span',{class:'cn1',text:'+'+q(c.ventas)}),el('span',{class:'cn2',text:'-'+q(c.gastos)}),el('span',{class:'cn3',style:'color:'+gcol,text:(c.ganancia<0?'-':'')+q(Math.abs(c.ganancia))})])])]);
    if(open){
      var d=el('div',{class:'hdet'});
      function sec(titulo,color,items,sign,fn){
        d.appendChild(el('div',{class:'cuth',style:'color:'+color,text:titulo}));
        if(!items.length){d.appendChild(el('div',{class:'meta',text:'Nada en este periodo.'}));return}
        items.forEach(function(x){
          var r=el('div',{class:'cutrow'},[el('span',{class:'cd',text:dateOf(x.d).toLocaleDateString('es-GT',{day:'numeric',month:'short'})}),
            el('span',{class:'cn',},[el('b',{text:x.n}),x.k||x.ds?el('small',{text:[x.k,x.ds].filter(Boolean).join(' · ')}):null]),el('span',{class:'ca',text:sign+q(x.a)})]);
          if(editable){r.appendChild(el('button',{type:'button',class:'cx','aria-label':'Borrar',text:'×',onclick:function(){if(this.dataset.sure!=='1'){this.dataset.sure='1';this.textContent='¿?';return}fn(x)}}))}
          d.appendChild(r);
        });
      }
      sec('QUÉ VENDÍ · '+q(c.ventas),'var(--ok)',c.vItems,'+',function(x){var pr=prints.find(function(p){return p.incomeId===x.id}),od=orders.find(function(o){return o.incomeId===x.id});db.doc('incomes/'+x.id).delete().then(function(){return pr?db.doc('prints/'+pr.id).update({saleQ:null,incomeId:null}):null}).then(function(){return od?db.doc('orders/'+od.id).update({incomeId:null,status:'listo'}):null}).then(function(){toast('Borrado')}).catch(fail)});
      sec('QUÉ GASTÉ · '+q(c.gastos),'var(--bad)',c.gItems,'-',function(x){db.doc('expenses/'+x.id).delete().then(function(){if(x.ph)PH.del(x.ph);toast('Borrado')}).catch(fail)});
      d.appendChild(el('div',{class:'cuttot'},[el('span',{text:'GANANCIA'}),el('b',{style:'color:'+gcol,text:(c.ganancia<0?'-':'')+q(Math.abs(c.ganancia))})]));
      d.appendChild(el('div',{class:'meta',text:'Filamento usado: '+fmtG(c.gramos)+' en '+c.nImp+(c.nImp===1?' impresión':' impresiones')}));
      card.appendChild(d);
    }
    return card;
  }
  function vHistFinanciero(root){
    root.appendChild(el('div',{class:'row'},[el('button',{class:'btn primary',text:'+ Venta',onclick:function(){histAdd='ganancias';render()}})]));
    root.appendChild(el('div',{class:'meta',text:'Cada día 15 se guarda solito el corte del periodo (del 16 al 15): qué vendiste, qué gastaste y tu ganancia.'}));
    var tdy=todayStr(),ps=allPeriods();
    if(!ps.length){root.appendChild(emptyBox('Todavía no hay movimientos. Anota ventas y gastos, y el día 15 se guarda tu primer corte.'));return}
    ps.forEach(function(p){
      var id='c'+p.end,ex=cortes.find(function(c){return c.id===id});
      var c=(ex&&ex.frozen)?ex:buildCut(p);if(!(ex&&ex.frozen))c.frozen=false;
      root.appendChild(cutCard(c,!c.frozen,!c.frozen));
    });
  }
  function ventaForm(){
    var f=el('form',{class:'card'});
    f.appendChild(el('h2',{text:'Nueva venta'}));
    var concept=el('input',{required:'',placeholder:'Ej. 50 llaveros Cross Nails','aria-label':'Qué vendiste'});
    var amt=el('input',{type:'number',inputmode:'decimal',min:'0',step:'any',step:'0.01',required:'',placeholder:'0','aria-label':'Monto en quetzales'});
    var dt=el('input',{type:'date',value:todayStr(),required:'','aria-label':'Fecha'});
    f.appendChild(el('label',{},['¿Qué vendiste?',concept]));
    f.appendChild(el('div',{class:'grid2'},[el('label',{},['Monto (Q)',amt]),el('label',{},['Fecha',dt])]));
    f.appendChild(el('div',{class:'row'},[el('button',{class:'btn primary',type:'submit',text:'Guardar'}),el('button',{class:'btn',type:'button',text:'Cancelar',onclick:function(){histAdd=null;render()}})]));
    f.addEventListener('submit',function(e){e.preventDefault();var v=parseFloat(amt.value);if(!(v>0))return toast('Escribe el monto');
      db.collection('incomes').doc().set({concept:concept.value.trim(),amountQ:v,date:dt.value||todayStr(),createdAt:new Date().toISOString()}).then(function(){histAdd=null;toast('¡Venta anotada!')}).catch(fail)});
    return f;
  }
  function vHistorial(root){
    if(histAdd){root.appendChild(ventaForm());return}
    root.appendChild(el('div',{class:'sec'},[el('h2',{text:'Historial'})]));
    var seg=el('div',{class:'chipsel'});
    [['imp','Impresiones'],['fin','Financiero']].forEach(function(o){seg.appendChild(el('button',{type:'button',class:'opt-chip'+(histMode===o[0]?' on':''),text:o[1],onclick:function(){histMode=o[0];render()}}))});
    root.appendChild(seg);
    if(histMode==='fin')vHistFinanciero(root);else vHistImpresiones(root);
  }

  // ---------------- Pintar ----------------
  function render(){
    document.querySelectorAll('#tabs button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.v===view?'true':'false')});
    var dot=document.querySelector('#tabs [data-v="impresoras"] .dot');var np=jobs.filter(function(j){return !j.applied}).length;if(dot)dot.hidden=!np;
    stats();$('stats').style.display=(view==='bobinas'||view==='impresoras')?'':'none';
    var root=$('view');root.textContent='';root.style.cssText='display:flex;flex-direction:column;gap:14px';
    if(render.last!==view){render.last=view;root.classList.add('anim');clearTimeout(render.t);render.t=setTimeout(function(){root.classList.remove('anim')},500)}
    if(!loaded){root.appendChild(emptyBox('Cargando tu taller…'));return}
    if(view==='bobinas')vBobinas(root);else if(view==='imprimir'){root.appendChild(el('button',{class:'btn ghost',type:'button',text:'← Volver al historial',onclick:function(){go('historial')}}));vImprimir(root)}else if(view==='impresoras')vImpresoras(root);else if(view==='pedidos')vPedidos(root);else if(view==='numeros')vNumeros(root);else if(view==='gastos')vGastos(root);else if(view==='historial')vHistorial(root);else if(view==='yo')vYo(root);else vBobinas(root);
    fitNums();
  }
  function fitNums(){document.querySelectorAll('.stat b').forEach(function(b){b.style.fontSize='';var fs=parseFloat(getComputedStyle(b).fontSize),n=0;while(b.scrollWidth>b.clientWidth+1&&fs>11&&n++<30){fs-=1;b.style.fontSize=fs+'px'}})}
  window.addEventListener('resize',function(){fitNums()});
  var soonT=null;
  function soon(){if(soonT)return;soonT=setTimeout(function(){soonT=null;var a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='SELECT')&&a.closest('#view'))return;render()},700)}
  function fail(e){toast('No se pudo guardar. Intenta de nuevo.');console.error(e)}
  function go(v){view=v;showAdd=false;adjusting=null;if(location.hash!=='#'+v)location.hash=v;render();window.scrollTo(0,0)}

  document.querySelectorAll('#tabs button').forEach(function(b){b.addEventListener('click',function(){go(b.dataset.v)})});
  var h=location.hash.replace('#','');if(h==='dinero')h='historial';if(VIEWS.indexOf(h)>-1)view=h;
  window.addEventListener('hashchange',function(){var x=location.hash.replace('#','');if(VIEWS.indexOf(x)>-1&&x!==view){view=x;render()}});

  var got={};var NEED=['spools','prints','printers','printerJobs','expenses','incomes','cortes','orders'];
  function on(name,set){db.collection(name).onSnapshot(function(s){set(snap(s));got[name]=true;
    if(!loaded&&NEED.every(function(n){return got[n]})){loaded=true;boot()}
    if(loaded){cortesSoon();migrateOrders()}
    var a=document.activeElement;if(a&&(a.tagName==='INPUT')&&a.closest('#view'))return;render()})}
  on('spools',function(v){spools=v});on('prints',function(v){prints=v});
  on('printers',function(v){printers=v});on('printerJobs',function(v){jobs=v});on('expenses',function(v){expenses=v});on('incomes',function(v){incomes=v});on('cortes',function(v){cortes=v});on('orders',function(v){orders=v});

  setInterval(function(){cortesSoon()},3600000);
  var booted=false;
  function boot(){
    if(booted||!NATIVE)return;booted=true;
    if(cloud&&cloud.token)cloudSync();
  }
  render();
  setInterval(function(){if(view==='impresoras'&&loaded)soon()},30000);
  setInterval(function(){if(NATIVE&&cloud&&cloud.token&&!document.hidden)cloudSync()},60000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&NATIVE&&cloud&&cloud.token)cloudSync()});
})();

</script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});</script></body></html>
